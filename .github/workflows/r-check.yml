name: R project checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install packages
        run: Rscript -e 'install.packages(c("testthat","readr","dplyr","lubridate","ggplot2","dataRetrieval","forecast","Kendall","trend","mgcv","changepoint","broom","scales","zoo"), repos="https://cloud.r-project.org")'
      - name: Check source files parse
        run: Rscript -e 'files <- list.files("R", pattern="\\.R$", full.names=TRUE); invisible(lapply(files, parse)); parse("run_all.R")'
      - name: Ensure testthat is installed
        run: Rscript -e 'if (!requireNamespace("testthat", quietly=TRUE)) install.packages("testthat", repos="https://cloud.r-project.org")'
      - name: Run tests if processed data exists
        run: Rscript -e 'testthat::test_file("tests/test_data_checks.R")'
